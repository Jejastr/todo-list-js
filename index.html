<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDoApp</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7b68ee" />

</head>

<body>
  <h1>To Do App</h1>

  <div class="conteiner">
    <div class="addTask">
      <input id="addTodoInput" type="text" class="text" placeholder="Введіть нове завдання..." />
      <button type="submit" id="addTodoBtn" class="button">Додати</button>
    </div>

    <div class="progress-container">
      <div class="progress-info">
        <span class="progress-text">0 з 0 виконано</span>
        <span class="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">
        Всі <span id="countAll" class="filter-count">0</span>
      </button>
      <button class="filter-btn" data-filter="active">
        Активні <span id="countActive" class="filter-count">0</span>
      </button>
      <button class="filter-btn" data-filter="important">
        Важливі ⭐ <span id="countImportant" class="filter-count">0</span>
      </button>
      <button class="filter-btn" data-filter="completed">
        Виконані <span id="countCompleted" class="filter-count">0</span>
      </button>
    </div>

    <ul id="todoList" class="list"></ul>
  </div>

  <script src="script.js"></script>
</body>

</html>
